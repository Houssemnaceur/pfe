# ===== Base de données =====
spring.datasource.url=jdbc:mysql://localhost:3306/pfe?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root

# IMPORTANT : Si ton utilisateur root n'a PAS de mot de passe (cas très fréquent avec XAMPP, WAMP, ou installation locale par défaut)
spring.datasource.password=

# Si tu as défini un mot de passe pour root, mets-le ici (exemple) :
# spring.datasource.password=ton_mot_de_passe

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Correction importante : MySQL8Dialect est déprécié depuis Hibernate 6
# Utilise plutôt le dialecte générique (recommandé avec Spring Boot 3.2 + MySQL 8)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Upload fichiers =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Serveur =====
server.port=8081