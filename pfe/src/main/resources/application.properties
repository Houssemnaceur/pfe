# ===== Base de données =====
spring.datasource.url=jdbc:mysql://localhost:3306/pfe?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=DEBUG

# CORRECTION : supprimer la ligne dialect ? Hibernate 7 la détecte automatiquement
# Ne pas mettre spring.jpa.properties.hibernate.dialect du tout

# ===== JWT =====
app.jwt.secret=GemonetSecretKeyMonoprixTunisie2024SuperSecureBase64EncodedKey==
app.jwt.expiration=86400000

# ===== Upload fichiers =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Serveur =====
server.port=8081